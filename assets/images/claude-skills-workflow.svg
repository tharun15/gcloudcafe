<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Claude Skills Workflow Automation</text>

  <!-- Main workflow box -->
  <rect x="100" y="80" width="600" height="250" rx="10" ry="10" fill="white" stroke="#3498db" stroke-width="2"/>

  <!-- Input section -->
  <rect x="150" y="120" width="120" height="60" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="210" y="145" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">User Request</text>
  <text x="210" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">"Automate my workflow"</text>

  <!-- Arrow to Claude Skills -->
  <path d="M270 150 L320 150 L320 180 L350 165" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Claude Skills box -->
  <rect x="350" y="150" width="120" height="80" rx="5" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <text x="410" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Claude Skills</text>
  <text x="410" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Structured Instructions</text>
  <text x="410" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Scripts & Templates</text>

  <!-- Arrow to Output -->
  <path d="M470 190 L520 190 L520 220 L550 205" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Output section -->
  <rect x="550" y="170" width="120" height="100" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="610" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Automated Output</text>
  <text x="610" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Consistent Results</text>
  <text x="610" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Standardized Workflow</text>

  <!-- Skill components visualization -->
  <rect x="150" y="250" width="500" height="60" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="170" y="275" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">📄 SKILL.md</text>
  <text x="270" y="275" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">📁 Scripts/</text>
  <text x="370" y="275" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">📄 Templates/</text>
  <text x="470" y="275" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">📚 Resources/</text>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Description -->
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">Structured workflow automation with reusable Claude Skills</text>
</svg>