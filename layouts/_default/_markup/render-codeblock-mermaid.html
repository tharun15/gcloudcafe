<div class="mermaid-wrapper relative my-8 p-4 sm:p-6 bg-slate-50/50 dark:bg-slate-900/40 rounded-2xl border border-slate-200/60 dark:border-slate-800/60 overflow-hidden text-center min-h-[160px]">
  <div class="mermaid-skeleton absolute inset-0 flex flex-col items-center justify-center gap-2 text-xs font-mono text-slate-400 dark:text-slate-500 bg-slate-100/50 dark:bg-slate-900/60 backdrop-blur-xs transition-opacity duration-300">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-diagram-project text-sky-500 animate-pulse"></i>
      <span class="font-medium">Rendering architecture diagram...</span>
    </div>
  </div>
  <div class="mermaid flex justify-center items-center w-full max-h-[480px] overflow-hidden opacity-0 transition-opacity duration-300">
{{ .Inner | safeHTML }}
  </div>
</div>

<style>
  .mermaid-wrapper {
    min-height: 180px;
  }
  .mermaid {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-height: 480px !important;
    overflow: hidden !important;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease-in;
  }
  .mermaid[data-processed="true"] {
    opacity: 1 !important;
    visibility: visible !important;
  }
  .mermaid svg {
    max-height: 450px !important;
    width: auto !important;
    max-width: 100% !important;
    height: auto !important;
    display: block;
    margin: 0 auto;
    object-fit: contain;
  }
  .mermaid text {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  }
  .mermaid .cluster rect {
    rx: 8px !important;
    ry: 8px !important;
  }
</style>

<script type="module">
  if (!window.__mermaid_initialized) {
    window.__mermaid_initialized = true;
    try {
      const isDark = document.documentElement.classList.contains('dark') || document.body.classList.contains('dark');
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
      mermaid.initialize({
        startOnLoad: true,
        theme: isDark ? 'dark' : 'neutral',
        securityLevel: 'loose',
        fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        fontSize: 15,
        themeVariables: {
          fontSize: '15px',
          fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
          primaryTextColor: isDark ? '#f1f5f9' : '#0f172a',
          secondaryTextColor: isDark ? '#cbd5e1' : '#334155',
          tertiaryTextColor: isDark ? '#94a3b8' : '#475569',
          lineColor: isDark ? '#94a3b8' : '#475569',
        },
        flowchart: {
          useMaxWidth: true,
          htmlLabels: false,
          curve: 'basis',
          nodeSpacing: 40,
          rankSpacing: 45,
          padding: 24
        },
        sequence: {
          useMaxWidth: true,
          actorFontSize: 16,
          messageFontSize: 15,
          noteFontSize: 14
        }
      });
      await mermaid.run({
        querySelector: '.mermaid'
      });
      document.querySelectorAll('.mermaid-skeleton').forEach(el => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      });
    } catch (e) {
      console.error('Mermaid render error:', e);
      document.querySelectorAll('.mermaid-skeleton').forEach(el => el.remove());
      document.querySelectorAll('.mermaid').forEach(el => {
        el.style.opacity = '1';
        el.style.visibility = 'visible';
      });
    }
  }
</script>
