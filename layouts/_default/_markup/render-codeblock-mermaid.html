<div class="mermaid flex justify-center my-8 p-4 sm:p-6 bg-slate-50/50 dark:bg-slate-900/40 rounded-2xl border border-slate-200/60 dark:border-slate-800/60 overflow-hidden text-center">
{{ .Inner | safeHTML }}
</div>

<style>
  .mermaid {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-height: 480px !important;
    overflow: hidden !important;
  }
  .mermaid svg {
    max-height: 450px !important;
    width: auto !important;
    max-width: 100% !important;
    height: auto !important;
    display: block;
    margin: 0 auto;
    object-fit: contain;
  }
  .mermaid text {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  }
  .mermaid .cluster rect {
    rx: 8px !important;
    ry: 8px !important;
  }
</style>

<script type="module">
  if (!window.__mermaid_initialized) {
    window.__mermaid_initialized = true;
    try {
      const isDark = document.documentElement.classList.contains('dark') || document.body.classList.contains('dark');
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
      mermaid.initialize({
        startOnLoad: true,
        theme: isDark ? 'dark' : 'neutral',
        securityLevel: 'loose',
        fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        fontSize: 15,
        themeVariables: {
          fontSize: '15px',
          fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
          primaryTextColor: isDark ? '#f1f5f9' : '#0f172a',
          secondaryTextColor: isDark ? '#cbd5e1' : '#334155',
          tertiaryTextColor: isDark ? '#94a3b8' : '#475569',
          lineColor: isDark ? '#94a3b8' : '#475569',
        },
        flowchart: {
          useMaxWidth: true,
          htmlLabels: false,
          curve: 'basis',
          nodeSpacing: 40,
          rankSpacing: 45,
          padding: 24
        },
        sequence: {
          useMaxWidth: true,
          actorFontSize: 16,
          messageFontSize: 15,
          noteFontSize: 14
        }
      });
      mermaid.run({
        querySelector: '.mermaid'
      });
    } catch (e) {
      console.error('Mermaid render error:', e);
    }
  }
</script>
