<!-- Crisp Chat -->
{{ with site.Params.crisp_website_id }}
  <script type="text/javascript">
    window.$crisp=[];
    window.CRISP_WEBSITE_ID="{{ . }}";
    (function(){
      d=document;
      s=d.createElement("script");
      s.src="https://client.crisp.chat/l.js";
      s.async=1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>
{{ end }}
