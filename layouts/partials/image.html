<!-- Image partial - renders img elements with optional webp support -->
{{ $src := .Src }}
{{ $alt := .Alt }}
{{ $class := .Class }}
{{ $context := .Context }}
{{ $size := .Size }}

<img
  src="{{ $src | relURL }}"
  alt="{{ $alt }}"
  {{ if $class }}class="{{ $class }}"{{ end }}
  loading="lazy"
  decoding="async" />
