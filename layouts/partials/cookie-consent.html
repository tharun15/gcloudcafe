<!-- Modern Glassmorphic Cookie & Privacy Consent Banner (GDPR / CCPA Compliant) -->
<div id="cookie-consent-banner" class="fixed bottom-4 left-4 right-4 sm:right-auto sm:max-w-md z-50 transition-all duration-500 transform translate-y-full opacity-0 hidden">
  <div class="bg-white/95 dark:bg-[#0c1220]/95 backdrop-blur-md border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
    
    <!-- Banner Header -->
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-500 shrink-0 text-lg">
          <i class="fa-solid fa-cookie-bite"></i>
        </div>
        <div>
          <div class="text-sm font-bold text-slate-900 dark:text-white leading-tight">
            We value your privacy
          </div>
          <p class="text-[11px] font-mono text-slate-500 dark:text-slate-400 m-0">
            GDPR & Privacy Preferences
          </p>
        </div>
      </div>

      <button id="cookie-consent-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs p-1 transition-colors border-none bg-transparent cursor-pointer" aria-label="Close cookie banner">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Message Copy -->
    <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed m-0">
      We use cookies to analyze site traffic, personalize content, and enhance your Cloud Pulse newsroom experience. By clicking <strong>"Accept All"</strong>, you consent to our privacy practices.
    </p>

    <!-- Action Control Buttons -->
    <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
      <button id="cookie-essential-only" class="px-3.5 py-1.5 rounded-lg text-xs font-mono font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 transition-all cursor-pointer">
        Essential Only
      </button>
      <button id="cookie-accept-all" class="px-4 py-1.5 rounded-lg text-xs font-mono font-bold text-white shadow-xs transition-all border-none cursor-pointer" style="background-color: #dc2626 !important;">
        <i class="fa-solid fa-check mr-1.5"></i> Accept All
      </button>
    </div>

  </div>
</div>

<script>
  (function () {
    var banner = document.getElementById("cookie-consent-banner");
    var btnAcceptAll = document.getElementById("cookie-accept-all");
    var btnEssential = document.getElementById("cookie-essential-only");
    var btnClose = document.getElementById("cookie-consent-close");

    if (!banner) return;

    // Check if preference already saved in localStorage
    var savedConsent = localStorage.getItem("gcloudcafe_cookie_consent");

    if (!savedConsent) {
      setTimeout(function () {
        banner.classList.remove("hidden");
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            banner.classList.remove("translate-y-full", "opacity-0");
            banner.classList.add("translate-y-0", "opacity-100");
          });
        });
      }, 800);
    }

    function hideBanner(choice) {
      localStorage.setItem("gcloudcafe_cookie_consent", choice);
      banner.classList.remove("translate-y-0", "opacity-100");
      banner.classList.add("translate-y-full", "opacity-0");
      setTimeout(function () {
        banner.classList.add("hidden");
      }, 500);
    }

    if (btnAcceptAll) {
      btnAcceptAll.addEventListener("click", function () {
        hideBanner("accepted");
      });
    }

    if (btnEssential) {
      btnEssential.addEventListener("click", function () {
        hideBanner("essential");
      });
    }

    if (btnClose) {
      btnClose.addEventListener("click", function () {
        hideBanner("dismissed");
      });
    }
  })();
</script>
