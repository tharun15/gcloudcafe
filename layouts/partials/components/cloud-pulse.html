<section id="cloud-pulse-section" class="section py-12 bg-gradient-to-b from-body via-theme-light/30 to-body dark:from-darkmode-body dark:via-darkmode-theme-light/20 dark:to-darkmode-body border-b border-border/60 dark:border-darkmode-border/60">
  <div class="container">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
      <div>
        <span class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-primary px-3 py-1 rounded-full bg-primary/10 mb-2">
          <i class="fa-solid fa-fire text-amber-500 animate-pulse"></i> What's Brewing
        </span>
        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-dark dark:text-darkmode-dark">
          Cloud Pulse <span class="text-primary text-xl font-medium">| Micro-News & Trends</span>
        </h2>
        <p class="text-sm sm:text-base text-text/85 dark:text-darkmode-text/85 mt-2 max-w-xl font-normal">
          Upvote trending cloud updates to rank them higher, or submit a micro-pulse update live!
        </p>
      </div>

    </div>

    <!-- Live Cloud Pulses Grid -->
    <div data-cloud-pulse-feed class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-10 text-xs font-bold text-text/60 dark:text-darkmode-text/60">
        <i class="fa-solid fa-spinner fa-spin text-lg text-primary mb-2 block"></i>
        Loading Cloud Pulse...
      </div>
    </div>
  </div>

  <!-- Admin Quick-Post Modal -->
  <div id="pulse-admin-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 transition-opacity">
    <div class="bg-body dark:bg-darkmode-body border border-border/80 dark:border-darkmode-border/80 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl relative">
      <button 
        data-close-pulse-admin 
        class="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-white flex items-center justify-center border-none cursor-pointer"
        aria-label="Close modal">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="mb-6">
        <span class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-primary px-2.5 py-0.5 rounded-full bg-primary/15 mb-2">
          <i class="fa-solid fa-shield-halved"></i> Admin Post
        </span>
        <h3 class="text-xl font-bold text-dark dark:text-darkmode-dark">Broadcast Cloud Update</h3>
        <p class="text-xs text-text/70 dark:text-darkmode-text/70">Share what's currently happening in the cloud community.</p>
      </div>

      <form data-pulse-admin-form class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-text/80 dark:text-darkmode-text/80 mb-1">
            Admin Passcode
          </label>
          <input 
            type="password" 
            name="passcode" 
            placeholder="Enter admin passcode..." 
            required 
            class="w-full px-3.5 py-2.5 rounded-xl border border-border/80 dark:border-darkmode-border/80 bg-theme-light dark:bg-darkmode-theme-light text-xs font-semibold focus:outline-none focus:border-primary text-dark dark:text-darkmode-dark"
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-text/80 dark:text-darkmode-text/80 mb-1">
            Pulse Headline
          </label>
          <input 
            type="text" 
            name="title" 
            placeholder="e.g., OpenShift 4.16 Security Enhancements Released" 
            required 
            class="w-full px-3.5 py-2.5 rounded-xl border border-border/80 dark:border-darkmode-border/80 bg-theme-light dark:bg-darkmode-theme-light text-xs font-semibold focus:outline-none focus:border-primary text-dark dark:text-darkmode-dark"
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-text/80 dark:text-darkmode-text/80 mb-1">
            Micro Content
          </label>
          <textarea 
            name="content" 
            rows="3" 
            placeholder="Brief update (1-3 sentences)..." 
            required 
            class="w-full px-3.5 py-2.5 rounded-xl border border-border/80 dark:border-darkmode-border/80 bg-theme-light dark:bg-darkmode-theme-light text-xs font-semibold focus:outline-none focus:border-primary text-dark dark:text-darkmode-dark resize-none"
          ></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-text/80 dark:text-darkmode-text/80 mb-1">
            Event / Official Link (Optional)
          </label>
          <input 
            type="url" 
            name="link_url" 
            placeholder="e.g. https://cloud.google.com/next" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-border/80 dark:border-darkmode-border/80 bg-theme-light dark:bg-darkmode-theme-light text-xs font-semibold focus:outline-none focus:border-primary text-dark dark:text-darkmode-dark"
          />
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-text/80 dark:text-darkmode-text/80 mb-1">
            Tags (comma separated)
          </label>
          <input 
            type="text" 
            name="tags" 
            placeholder="e.g. #OpenShift, #Kubernetes, #EX280" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-border/80 dark:border-darkmode-border/80 bg-theme-light dark:bg-darkmode-theme-light text-xs font-semibold focus:outline-none focus:border-primary text-dark dark:text-darkmode-dark"
          />
        </div>

        <div class="pt-2 flex items-center justify-end gap-3">
          <span data-pulse-admin-status class="text-xs font-semibold mr-auto"></span>
          <button 
            type="submit" 
            class="btn btn-primary rounded-xl px-5 py-2.5 text-xs font-bold shadow-md cursor-pointer border-none">
            Broadcast Live
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
