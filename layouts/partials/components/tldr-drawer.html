<!-- Executive TL;DR Quick-Scan Drawer Component -->
<div
  id="tldr-drawer"
  class="fixed inset-0 z-50 pointer-events-none opacity-0 transition-opacity duration-300 ease-in-out"
  role="dialog"
  aria-modal="true"
  aria-labelledby="tldr-drawer-heading">

  <!-- Backdrop with glassmorphism blur -->
  <div
    id="tldr-drawer-backdrop"
    class="absolute inset-0 bg-slate-900/60 dark:bg-black/70 backdrop-blur-xs transition-opacity duration-300 cursor-pointer">
  </div>

  <!-- Slide-out Drawer Panel -->
  <div
    id="tldr-drawer-panel"
    class="absolute right-0 top-0 bottom-0 w-full max-w-lg bg-white dark:bg-[#0a0f1d] border-l border-slate-200 dark:border-slate-800 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between overflow-hidden">

    <!-- Drawer Header -->
    <div class="px-6 py-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/70 dark:bg-slate-900/40 shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center font-bold text-sm border border-amber-500/20">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <h3 id="tldr-drawer-heading" class="text-base font-bold text-slate-900 dark:text-white mb-0 leading-tight">
            Executive Quick-Scan
          </h3>
          <p class="text-[11px] font-mono text-slate-500 dark:text-slate-400 mb-0">
            60-Second Architectural Digest
          </p>
        </div>
      </div>

      <button
        type="button"
        data-tldr-drawer-close
        class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
        aria-label="Close Executive TL;DR Drawer">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Drawer Body -->
    <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6 text-sm" id="tldr-drawer-body">
      <!-- Article Title -->
      <div>
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded font-mono text-[10px] font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 mb-2">
          Architecture Summary
        </span>
        <h4 id="tldr-drawer-title" class="text-lg font-bold text-slate-900 dark:text-white leading-snug">
          Article Digest
        </h4>
      </div>

      <!-- Problem Statement Card -->
      <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">
        <div class="flex items-center gap-2 mb-2 text-rose-600 dark:text-rose-400 font-bold font-mono text-xs uppercase tracking-wider">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>The Core Problem</span>
        </div>
        <p id="tldr-drawer-problem" class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed mb-0">
          Loading problem statement...
        </p>
      </div>

      <!-- Core Recommendation Card -->
      <div class="p-4 rounded-xl bg-emerald-500/5 dark:bg-emerald-950/20 border border-emerald-500/20">
        <div class="flex items-center gap-2 mb-2 text-emerald-600 dark:text-emerald-400 font-bold font-mono text-xs uppercase tracking-wider">
          <i class="fa-solid fa-lightbulb"></i>
          <span>Architectural Recommendation</span>
        </div>
        <p id="tldr-drawer-recommendation" class="text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed mb-0">
          Loading recommendation...
        </p>
      </div>

      <!-- Production Gotchas Card -->
      <div class="p-4 rounded-xl bg-amber-500/5 dark:bg-amber-950/20 border border-amber-500/20">
        <div class="flex items-center gap-2 mb-2 text-amber-600 dark:text-amber-400 font-bold font-mono text-xs uppercase tracking-wider">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Production Gotchas &amp; Traps</span>
        </div>
        <p id="tldr-drawer-gotcha" class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed mb-0">
          Loading gotchas...
        </p>
      </div>

      <!-- Key Takeaways List -->
      <div>
        <div class="flex items-center gap-2 mb-3 text-slate-900 dark:text-white font-bold font-mono text-xs uppercase tracking-wider">
          <i class="fa-solid fa-list-check text-primary"></i>
          <span>Key Takeaways</span>
        </div>
        <ul id="tldr-drawer-takeaways" class="space-y-2 list-none p-0 m-0">
          <!-- Populated dynamically -->
        </ul>
      </div>
    </div>

    <!-- Drawer Footer Actions -->
    <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/40 flex items-center justify-between gap-3 flex-wrap shrink-0">
      <button
        type="button"
        id="tldr-copy-slack-btn"
        class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-slate-400 transition-all shadow-2xs cursor-pointer">
        <i class="fa-brands fa-slack text-[#4A154B] dark:text-[#E01E5A]"></i>
        <span>Copy for Slack / Teams</span>
      </button>

      <button
        type="button"
        data-tldr-drawer-close
        class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors cursor-pointer ml-auto">
        Close
      </button>
    </div>
  </div>
</div>
