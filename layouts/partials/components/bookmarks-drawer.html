{{/* Slide-Out Bookmarks & Save for Later Drawer */}}
<div
  id="bookmarks-drawer"
  class="fixed inset-0 z-50 overflow-hidden pointer-events-none opacity-0 transition-opacity duration-300"
  role="dialog"
  aria-modal="true"
  aria-labelledby="bookmarks-drawer-title">
  
  <!-- Backdrop Blur Overlay -->
  <div
    id="bookmarks-drawer-backdrop"
    class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs transition-opacity duration-300"></div>

  <div class="fixed inset-y-0 right-0 max-w-full flex pl-6 sm:pl-10">
    <div
      id="bookmarks-drawer-panel"
      class="w-screen max-w-md bg-white dark:bg-[#0c1220] shadow-2xl border-l border-slate-200/80 dark:border-slate-800/80 flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
      
      <!-- Drawer Header -->
      <div class="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-3 bg-slate-50/50 dark:bg-slate-900/30">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-red-500/10 text-red-600 dark:text-red-400 flex items-center justify-center shrink-0">
            <i class="fa-solid fa-bookmark text-sm"></i>
          </div>
          <div>
            <h2 id="bookmarks-drawer-title" class="text-sm sm:text-base font-bold text-slate-900 dark:text-white leading-tight">
              Saved Articles
            </h2>
            <div class="flex items-center gap-2 mt-0.5">
              <span id="bookmarks-drawer-count" class="text-[11px] font-mono font-medium text-slate-500 dark:text-slate-400">
                0 articles
              </span>
              <span class="text-slate-300 dark:text-slate-700">•</span>
              <span class="text-[11px] text-slate-400 dark:text-slate-500">
                Saved locally
              </span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button
            id="bookmarks-clear-all"
            type="button"
            class="text-[11px] font-medium text-slate-500 hover:text-red-600 dark:text-slate-400 dark:hover:text-red-400 px-2 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            style="display: none;"
            title="Clear all saved articles">
            Clear all
          </button>
          <button
            type="button"
            data-bookmarks-drawer-close
            class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            aria-label="Close saved articles drawer">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Drawer Content / List Container -->
      <div class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-3">
        
        <!-- Active Bookmarks List (dynamically populated) -->
        <div id="bookmarks-drawer-list" class="space-y-3"></div>

        <!-- Empty State -->
        <div id="bookmarks-empty-state" class="py-12 px-4 text-center flex flex-col items-center justify-center">
          <div class="w-14 h-14 rounded-2xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-center text-slate-400 dark:text-slate-500 mb-4 shadow-inner">
            <i class="fa-regular fa-bookmark text-2xl"></i>
          </div>
          <h3 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white mb-1.5">
            Your reading list is empty
          </h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mb-5 leading-relaxed">
            Bookmark deep-dive architecture articles, guides, and tutorials to read anytime.
          </p>
          <a
            href="{{ `blog/` | relLangURL }}"
            data-bookmarks-drawer-close
            class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold text-white bg-primary hover:bg-primary/90 transition-all shadow-sm shadow-primary/20 no-underline">
            <span>Explore Articles</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
          </a>
        </div>

      </div>

      <!-- Drawer Footer -->
      <div class="p-3.5 sm:p-4 border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-900/30 text-center">
        <p class="text-[11px] text-slate-400 dark:text-slate-500 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-shield-halved text-[10px] text-slate-400"></i>
          <span>Synced across tabs • Zero tracking cookies</span>
        </p>
      </div>

    </div>
  </div>
</div>
