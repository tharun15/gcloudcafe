{{ $class := .Class }}
{{ if site.Params.theme_switcher }}
  <div class="theme-switcher-modern {{ $class }} relative inline-flex items-center shrink-0">
    <input id="theme-switcher" data-theme-switcher type="checkbox" class="sr-only" aria-label="Toggle dark / light mode" />
    <label
      for="theme-switcher"
      class="h-9 w-9 flex items-center justify-center rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white bg-slate-100/70 dark:bg-slate-900/60 hover:bg-slate-200/70 dark:hover:bg-slate-800/80 border border-slate-200/70 dark:border-slate-800/70 transition-all cursor-pointer relative group shrink-0 shadow-2xs hover:shadow-xs active:scale-95"
      title="Toggle dark / light mode">
      <!-- Sun icon (shown in dark mode to switch to light) -->
      <svg class="w-4 h-4 hidden dark:inline-block text-amber-400 group-hover:rotate-45 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <!-- Moon icon (shown in light mode to switch to dark) -->
      <svg class="w-4 h-4 inline-block dark:hidden text-slate-700 group-hover:-rotate-12 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </label>
  </div>

  <script>
    (function () {
      function syncThemeToggle() {
        var isDark = document.documentElement.classList.contains("dark");
        var inputs = document.querySelectorAll("[data-theme-switcher], #theme-switcher");
        inputs.forEach(function (inp) {
          inp.checked = isDark;
        });
      }

      function initThemeToggle() {
        syncThemeToggle();
        var inputs = document.querySelectorAll("[data-theme-switcher], #theme-switcher");
        inputs.forEach(function (inp) {
          if (inp.__theme_bound) return;
          inp.__theme_bound = true;
          inp.addEventListener("change", function () {
            var willBeDark = inp.checked;
            document.documentElement.classList.toggle("dark", willBeDark);
            try {
              localStorage.setItem("theme", willBeDark ? "dark" : "light");
            } catch (e) {}
            syncThemeToggle();
          });
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initThemeToggle);
      } else {
        initThemeToggle();
      }
    })();
  </script>
{{ end }}
