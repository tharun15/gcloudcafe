<!-- Floating Article Audio Player Bar -->
<div
  id="article-audio-bar"
  class="hidden fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-40 w-[94%] max-w-xl bg-white/95 dark:bg-[#0c1220]/95 backdrop-blur-md border border-slate-200 dark:border-slate-800 shadow-2xl rounded-2xl p-3 sm:p-4 transition-all duration-300 ease-out"
  role="region"
  aria-label="Article Audio Player">

  <div class="flex flex-col gap-2">
    <!-- Header row: Title & Close -->
    <div class="flex items-center justify-between gap-3 min-w-0">
      <div class="flex items-center gap-2 min-w-0">
        <span class="relative flex h-2.5 w-2.5 shrink-0">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] font-mono uppercase font-bold tracking-wider text-emerald-600 dark:text-emerald-400">Audio Narration</span>
            <span id="audio-bar-mode" class="text-[10px] font-mono text-slate-400 dark:text-slate-500">• Deep Dive</span>
          </div>
          <p id="audio-bar-title" class="text-xs font-bold text-slate-900 dark:text-white truncate mb-0 leading-tight">
            Playing article...
          </p>
        </div>
      </div>

      <div class="flex items-center gap-1 shrink-0">
        <!-- Close / Stop button -->
        <button
          type="button"
          id="audio-bar-close"
          class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
          aria-label="Stop audio and close player"
          title="Stop Audio">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Progress Scrubber Bar -->
    <div
      id="audio-progress-bar"
      class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden cursor-pointer"
      role="progressbar"
      aria-valuenow="0"
      aria-valuemin="0"
      aria-valuemax="100">
      <div
        id="audio-progress-fill"
        class="bg-emerald-500 h-1.5 rounded-full transition-all duration-200"
        style="width: 0%;">
      </div>
    </div>

    <!-- Bottom Controls Row: Play/Pause, Speeds -->
    <div class="flex items-center justify-between gap-3 pt-0.5">
      <div class="flex items-center gap-2">
        <!-- Play / Pause Button -->
        <button
          type="button"
          id="audio-play-pause-btn"
          class="w-8 h-8 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center text-xs transition-transform active:scale-95 cursor-pointer shadow-xs"
          aria-label="Play or Pause Audio">
          <i class="fa-solid fa-pause"></i>
        </button>

        <span id="audio-bar-status" class="text-[11px] font-mono text-slate-500 dark:text-slate-400">
          Playing
        </span>
      </div>

      <!-- Playback Speed Controls -->
      <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-0.5 rounded-lg border border-slate-200/80 dark:border-slate-700/80">
        <button
          type="button"
          data-audio-rate="1"
          class="audio-rate-btn px-2 py-0.5 rounded text-[11px] font-mono font-bold transition-all bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-2xs cursor-pointer">
          1x
        </button>
        <button
          type="button"
          data-audio-rate="1.25"
          class="audio-rate-btn px-2 py-0.5 rounded text-[11px] font-mono font-bold transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer">
          1.25x
        </button>
        <button
          type="button"
          data-audio-rate="1.5"
          class="audio-rate-btn px-2 py-0.5 rounded text-[11px] font-mono font-bold transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer">
          1.5x
        </button>
        <button
          type="button"
          data-audio-rate="2"
          class="audio-rate-btn px-2 py-0.5 rounded text-[11px] font-mono font-bold transition-all text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer">
          2x
        </button>
      </div>
    </div>
  </div>
</div>
