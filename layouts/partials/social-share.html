<!-- Social Share partial -->
{{ $context := .Context }}
{{ $class := .Class | default "" }}
{{ $title := .Title | default "Share" }}
{{ $url := $context.Permalink }}
{{ $text := $context.Title }}

<div class="social-share {{ $class }}">
  <span class="inline-block mr-2">{{ $title }}:</span>
  <a
    href="https://www.facebook.com/sharer/sharer.php?u={{ $url | urlquery }}"
    rel="noopener noreferrer"
    target="_blank"
    aria-label="Share on Facebook"
    class="inline-flex items-center justify-center w-10 h-10 rounded-full hover:bg-primary/10 transition">
    <i class="fab fa-facebook-f"></i>
  </a>
  <a
    href="https://twitter.com/intent/tweet?url={{ $url | urlquery }}&text={{ $text | urlquery }}"
    rel="noopener noreferrer"
    target="_blank"
    aria-label="Share on Twitter"
    class="inline-flex items-center justify-center w-10 h-10 rounded-full hover:bg-primary/10 transition">
    <i class="fab fa-twitter"></i>
  </a>
  {{ if .Linkedin }}
    <a
      href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url | urlquery }}"
      rel="noopener noreferrer"
      target="_blank"
      aria-label="Share on LinkedIn"
      class="inline-flex items-center justify-center w-10 h-10 rounded-full hover:bg-primary/10 transition">
      <i class="fab fa-linkedin-in"></i>
    </a>
  {{ end }}
  {{ if .Whatsapp }}
    <a
      href="https://wa.me/?text={{ $text | urlquery }} {{ $url | urlquery }}"
      rel="noopener noreferrer"
      target="_blank"
      aria-label="Share on WhatsApp"
      class="inline-flex items-center justify-center w-10 h-10 rounded-full hover:bg-primary/10 transition">
      <i class="fab fa-whatsapp"></i>
    </a>
  {{ end }}
  {{ if .Telegram }}
    <a
      href="https://t.me/share/url?url={{ $url | urlquery }}&text={{ $text | urlquery }}"
      rel="noopener noreferrer"
      target="_blank"
      aria-label="Share on Telegram"
      class="inline-flex items-center justify-center w-10 h-10 rounded-full hover:bg-primary/10 transition">
      <i class="fab fa-telegram"></i>
    </a>
  {{ end }}
</div>
