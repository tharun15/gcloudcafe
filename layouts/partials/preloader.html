<!-- Preloader -->
{{ if site.Params.preloader_enabled | default false }}
  <div id="preloader" class="fixed inset-0 z-50 flex items-center justify-center bg-body dark:bg-darkmode-body">
    <div class="h-12 w-12 animate-spin rounded-full border-4 border-border border-t-primary dark:border-darkmode-border dark:border-t-darkmode-primary"></div>
  </div>

  <script>
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        preloader.style.display = 'none';
      }
    });
  </script>
{{ end }}
