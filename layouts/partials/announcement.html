<!-- Announcement Banner -->
{{ with site.Params.announcement_text }}
  <div class="announcement-banner bg-primary dark:bg-darkmode-primary text-white p-3 text-center text-sm" role="region" aria-live="polite">
    {{ . | safeHTML }}
    <button class="ml-3 text-white hover:opacity-80" aria-label="Close announcement" onclick="this.parentElement.style.display='none';">
      <svg class="inline h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
{{ end }}
