name: Cloud Pulse 12-Hour Fallback Auto-Publisher

on:
  schedule:
    # Check every 4 hours for admin inactivity
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI or Admin portal

jobs:
  check-and-auto-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 12-Hour Fallback Auto-Publisher
        run: node scripts/auto-publish-cloud-pulse.js
        env:
          SUPABASE_URL: "https://axiijcsxtiukloarbfor.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_cRcwg02R3nXTykDrxalL6w_-kc9Wesc"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push fallback data updates directly to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cloud_pulse.json
          if git diff --staged --quiet; then
            echo "No pulse data updates to commit."
          else
            git commit -m "chore(pulse): auto-sync latest cloud_pulse.json direct to main [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
