name: Weekly Newsletter Digest & Dispatch

on:
  schedule:
    # Run every Sunday at 09:00 UTC
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (generate preview and archive without sending live emails)'
        required: false
        type: boolean
        default: false

jobs:
  digest-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Weekly Newsletter Digest Engine
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/weekly-newsletter-digest.js --dry-run
          else
            node scripts/weekly-newsletter-digest.js
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://axiijcsxtiukloarbfor.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_cRcwg02R3nXTykDrxalL6w_-kc9Wesc' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://gcloudcafe.com"

      - name: Commit Updated Newsletter Archive
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/newsletter_archive.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(newsletter): record weekly edition digest [skip ci]"
          git push || true
