name: Daily Trending Cloud Topics

on:
  schedule:
    # Run daily at 8 AM UTC (adjust timezone as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  trending-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Fetch trending topics
        id: trending
        run: |
          python .github/scripts/pytrends_fetch.py > trending_topics.json
          echo "topics=$(cat trending_topics.json)" >> $GITHUB_OUTPUT

      - name: Check existing posts
        id: check_posts
        run: |
          python .github/scripts/check_existing_posts.py ${{ steps.trending.outputs.topics }}

      - name: Generate markdown drafts
        id: generate
        run: |
          python .github/scripts/generate_draft.py \
            --topics ${{ steps.trending.outputs.topics }} \
            --output-dir content/english/blog/drafts

      - name: Create Pull Request
        if: steps.generate.outputs.draft_created == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: add AI-generated trending topic drafts'
          title: 'Daily Trending: ${{ steps.generate.outputs.topic_title }}'
          body: |
            ## Automated Trending Topic Draft

            **Topics Added:** ${{ steps.generate.outputs.topics_added }}

            **Generated Drafts:**
            ${{ steps.generate.outputs.draft_list }}

            ---
            This PR was automatically generated by the daily trending topics workflow.
            Please review the content before merging.

            **Checklist:**
            - [ ] Content is accurate and relevant
            - [ ] Formatting is correct
            - [ ] Links are working
            - [ ] Ready to publish

          branch: feature/trending-${{ github.run_number }}
          delete-branch: true
          labels: 'automated,blog,trending'
