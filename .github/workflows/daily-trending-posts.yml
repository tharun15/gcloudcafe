name: Daily Trending Cloud Topics

on:
  schedule:
    # Run daily at 8 AM UTC (adjust timezone as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  trending-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Fetch trending topics
        id: trending
        run: |
          python .github/scripts/pytrends_fetch.py > trending_topics.json
          echo "File contents:"
          cat trending_topics.json
          echo ""
          if [ -f trending_topics.json ] && [ -s trending_topics.json ]; then
            echo "✓ Trending topics fetched successfully"
          else
            echo "✗ File is empty or missing"
          fi
        continue-on-error: true

      - name: Check existing posts
        id: check_posts
        if: steps.trending.outcome == 'success'
        run: |
          echo "Reading topics from file:"
          cat trending_topics.json
          python .github/scripts/check_existing_posts.py < trending_topics.json
        continue-on-error: true

      - name: Generate markdown drafts
        id: generate
        run: |
          echo "Debug: Checking if topics file exists"
          if [ -f trending_topics.json ]; then
            echo "✓ File exists"
            echo "File size: $(wc -c < trending_topics.json) bytes"
            echo "Contents:"
            cat trending_topics.json
          else
            echo "✗ File does not exist!"
            exit 1
          fi
          
          python .github/scripts/generate_draft.py \
            --topics-file trending_topics.json \
            --output-dir content/english/blog/drafts
        continue-on-error: true

      - name: Create Pull Request
        if: steps.generate.outputs.draft_created == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: add AI-generated trending topic drafts'
          title: 'Daily Trending: ${{ steps.generate.outputs.topic_title }}'
          body: |
            ## Automated Trending Topic Draft

            **Topics Added:** ${{ steps.generate.outputs.topics_added }}

            **Generated Drafts:**
            ${{ steps.generate.outputs.draft_list }}

            ---
            This PR was automatically generated by the daily trending topics workflow.
            Please review the content before merging.

            **Checklist:**
            - [ ] Content is accurate and relevant
            - [ ] Formatting is correct
            - [ ] Links are working
            - [ ] Ready to publish

          branch: feature/trending-${{ github.run_number }}
          delete-branch: true
          labels: 'automated,blog,trending'

      - name: Workflow Summary
        if: always()
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trending Topics: ${{ steps.trending.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check Posts: ${{ steps.check_posts.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Generate Drafts: ${{ steps.generate.outcome }}" >> $GITHUB_STEP_SUMMARY
