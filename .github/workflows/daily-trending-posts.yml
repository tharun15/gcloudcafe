name: Daily Trending Cloud Topics

on:
  schedule:
    # Run daily at 8 AM UTC (adjust timezone as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  trending-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Fetch trending topics
        id: trending
        run: |
          python .github/scripts/pytrends_fetch.py > trending_topics.json
          if [ -f trending_topics.json ]; then
            echo "Trending topics fetched successfully"
          fi
        continue-on-error: true

      - name: Check existing posts
        id: check_posts
        if: steps.trending.outcome == 'success'
        run: |
          python .github/scripts/check_existing_posts.py < trending_topics.json
        continue-on-error: true

      - name: Generate markdown drafts
        id: generate
        if: steps.check_posts.outcome == 'success'
        run: |
          python .github/scripts/generate_draft.py \
            --topics-file trending_topics.json \
            --output-dir content/english/blog/drafts
        continue-on-error: true

      - name: Commit and push drafts directly to main
        if: steps.generate.outputs.draft_created == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/english/blog/drafts
          if git diff --staged --quiet; then
            echo "No new drafts to commit."
          else
            git commit -m "chore(blog): add trending topic drafts direct to main [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Trending Topics: ${{ steps.trending.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check Posts: ${{ steps.check_posts.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Generate Drafts: ${{ steps.generate.outcome }}" >> $GITHUB_STEP_SUMMARY
