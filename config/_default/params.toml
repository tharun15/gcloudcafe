#################### default parameters ############################
# favicon module: https://github.com/gethugothemes/hugo-modules/tree/master/images#favicon-implementation
favicon = "images/favicon.png"
# logo module: https://github.com/gethugothemes/hugo-modules/tree/master/images#logo-implementation
logo = "images/logo.png"
logo_darkmode = "images/logo-darkmode.png"
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
logo_width = "100px"
logo_height = "20px"
# if logo_webp set false, will not generate WEBP version of logo | default is true
logo_webp = true
# logo text will only show when logo is missing.
logo_text = "Gcloudcafe"
# navbar fixed to top
navbar_fixed = true
# theme-mode
theme_switcher = true
theme_default = "system" # available options [light/dark/system]
# Main Sections
mainSections = ["blog"]
# contact form action
contact_form_action = "#" # contact form works with [https://airform.io/] or [https://formspree.io]
# google tag manager, see https://developers.google.com/tag-manager/
#google_tag_manager = "G-N8R2LLDRSM" # example: G-XXXXXXXXXX
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>"
custom_script = "<script async src='https://www.googletagmanager.com/gtag/js?id=G-N8R2LLDRSM'></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('config', 'G-N8R2LLDRSM');</script>"

# Mobile & Professional Features
enable_table_of_contents = true
enable_reading_time = true
enable_breadcrumb = true
enable_author_profile = true
enable_related_posts = true
enable_newsletter_signup = true
enable_comments = true

# Giscus Comments Configuration (https://giscus.app)
[giscus]
enable = true
repo = "tharun15/gcloudcafe"
repo_id = "R_kgDONdsAfw"
category = "Announcements"
category_id = "DIC_kwDONdsAf84DCxn4"
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "bottom"
theme = "preferred_color_scheme"
lang = "en"

# Supabase Backend Configuration
[supabase]
enable = true
url = "https://axiijcsxtiukloarbfor.supabase.co"
anon_key = "sb_publishable_cRcwg02R3nXTykDrxalL6w_-kc9Wesc"

# Image Optimization
use_webp = true
lazy_load_images = true
responsive_images = true

# Performance
enable_minify = true
enable_cdn = false

# Mobile-Specific
mobile_menu_style = "slide"
mobile_font_size = "16px"
touch_target_size = "48px"

# copyright
copyright = "Designed & Developed by [Gcloudcafe](https://gcloudcafe.com)"

# search
# search module: https://github.com/gethugothemes/hugo-modules/tree/master/search
[search]
enable = true
primary_color = "#121212"
include_sections = ["blog"]
# include_all_sections = true
show_image = true
show_description = true
show_tags = true
show_categories = true

# seo meta data for OpenGraph / Twitter Card
# seo module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/basic-seo
[metadata]
keywords = ["Gcloudcafe", "Kubernetes", "Openshift", "AWS", "Azure", "GCP"]
description = "Your go-to source for practical tips on passing cloud certifications, up-to-date news on cloud technologies"
author = "Tharun Vempati"
twitter = "tharun26"
image = "images/logo.png"


# site verifications
# verification module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/site-verifications
[site_verification]
google = ""   # Your verification code
bing = ""     # Your verification code
baidu = ""    # Your verification code
facebook = "" # Your verification code
mastodon = "" # Your verification code

# cookies
# cookies module: https://github.com/gethugothemes/hugo-modules/tree/master/components/cookie-consent
[cookies]
enable = true
expire_days = 60
content = "This site uses cookies. By continuing to use this website, you agree to their use."
button = "I Accept"

# diagrams
[mermaid]
js_url = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs'

######################## sidebar widgets #########################
[widgets]
sidebar = ["categories", "tags"]


